# Architecture section 5.1: tests run one process per test, with timeouts. A test that hangs is
# reported slow every 60 s and killed after 5 periods, so it fails with its name instead of
# running to the CI job's timeout. The longest bounded wait in the suite is lactose-task's
# 4 x 60 s in `tests/block_in_place.rs`, which reports before the kill.
[profile.default]
slow-timeout = { period = "60s", terminate-after = 5 }

# The netcode spike's ignored measurements (`crates/app/tests/spike.rs`, the module `spike` of
# the package's one test binary) replay ten minutes of ticks in release: the slowest, fifty
# thrown bodies under the clock script, took 149 to 181 s at load averages of 8 to 25 on an M1.
# Ten periods leave three times that.
[[profile.default.overrides]]
filter = 'test(/^spike::ten_minutes_/)'
slow-timeout = { period = "60s", terminate-after = 10 }
