[workspace]
resolver = "3"
members = ["crates/*", "tools/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.99"
publish = false

# Internal crates. A crate's tier and boundary status live in crate-tiers.toml, never here.
[workspace.dependencies]
lactose-core = { path = "crates/core" }
lactose-math = { path = "crates/math" }
lactose-task = { path = "crates/task" }
lactose-reflect = { path = "crates/reflect" }
lactose-reflect-macros = { path = "crates/reflect-macros" }
lactose-ecs = { path = "crates/ecs" }
lactose-ecs-macros = { path = "crates/ecs-macros" }
lactose-asset-api = { path = "crates/asset-api" }
lactose-bundle = { path = "crates/bundle" }

# Third-party crates. Cargo.lock pins the exact versions; docs/verification.md lists the
# claims that are re-checked against those versions.
bytemuck = { version = "1.25", features = ["derive"] }
crossbeam-deque = "0.8"
libc = "0.2"
# Pinned exactly: libm releases swap in different algorithms, so a bump is a determinism change
# that must regenerate and re-review crates/math/tests/golden/vectors.txt. Features are named
# explicitly so an upstream change of defaults cannot alter the set. `arch` only swaps in
# hardware sqrt, fused multiply-add and rint, each exact or correctly rounded; the `unstable*`
# and `force-soft-floats` features must stay off (crates/math/README.md).
libm = { version = "=0.2.16", default-features = false, features = ["arch"] }
loom = "0.7"
proc-macro2 = "1"
quote = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
syn = "3"
toml = { version = "1", default-features = false, features = ["std", "parse", "serde"] }
tracing = { version = "0.1", default-features = false, features = ["std"] }
windows-sys = "0.61"
xxhash-rust = "0.8"

[workspace.lints.rust]
missing_docs = "warn"
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"

# Architecture section 18: dependencies optimised, line tables only, split debug info.
[profile.dev]
opt-level = 1
debug = "line-tables-only"
split-debuginfo = "unpacked"

[profile.dev.package."*"]
opt-level = 3
