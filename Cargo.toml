[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.99"
publish = false

# Internal crates. A crate's tier and boundary status live in crate-tiers.toml, never here.
[workspace.dependencies]
lactose-core = { path = "crates/core" }
lactose-math = { path = "crates/math" }
lactose-task = { path = "crates/task" }
lactose-reflect = { path = "crates/reflect" }
lactose-reflect-macros = { path = "crates/reflect-macros" }
lactose-ecs = { path = "crates/ecs" }
lactose-ecs-macros = { path = "crates/ecs-macros" }
lactose-asset-api = { path = "crates/asset-api" }
lactose-bundle = { path = "crates/bundle" }

# Third-party crates. Cargo.lock pins the exact versions; docs/verification.md lists the
# claims that are re-checked against those versions.
bytemuck = { version = "1.25", features = ["derive"] }
crossbeam-deque = "0.8"
libc = "0.2"
libm = "0.2"
loom = "0.7"
tracing = { version = "0.1", default-features = false, features = ["std"] }
windows-sys = "0.61"
xxhash-rust = "0.8"
zstd = { version = "0.13", default-features = false }

[workspace.lints.rust]
missing_docs = "warn"
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"

# Architecture section 18: dependencies optimised, line tables only, split debug info.
[profile.dev]
opt-level = 1
debug = "line-tables-only"
split-debuginfo = "unpacked"

[profile.dev.package."*"]
opt-level = 3
