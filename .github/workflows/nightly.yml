name: nightly

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # A dated nightly, so Miri breaks only when this line changes.
  MIRI_TOOLCHAIN: nightly-2026-10-04

# Architecture section 20: Miri, loom, the full SOUR matrix and architecture mode run nightly,
# and a SOUR baseline built with the release profile beside each platform's dev one.
jobs:
  # One job per crate, so each has the whole time limit and a timeout drops only its own
  # crate. As one job it took 38 to 57 minutes of its 60 in the green nightlies of 5 to 13
  # November 2026, and a timeout in `lactose-ecs` dropped the weak-memory steps after it.
  miri:
    name: miri (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: core
            key: core
            args: -p lactose-core
          # Architecture sections 20 and 22: `task` and `ecs` pass Miri. The executor runs
          # twice: over its stand-in deque, then over the real `crossbeam-deque`, which needs
          # Tree Borrows and leaks its epoch garbage by design (crates/task/SAFETY.md).
          - name: task
            key: task
            args: -p lactose-task
          - name: task, real deque
            key: task-real-deque
            args: -p lactose-task
            real_deque: "1"
            miriflags: -Zmiri-tree-borrows -Zmiri-ignore-leaks
          # `lactose-ecs` in four: the tests of its slowest test file, the binaries of their own
          # (`ownership`, the next slowest, among them), every other test, and the doc tests,
          # which cargo runs alone. Its other integration tests are one binary (D150), so the
          # first and third entries divide the tests of the targets they select by path: the
          # third skips the filter the first names, which `cargo xtask boundary` checks.
          - name: ecs, erased rows
            key: ecs
            args: '-p lactose-ecs --lib --test integration -- erased_rows::'
          - name: ecs, ownership and the binaries of their own
            key: ecs-separate
            args: -p lactose-ecs --test ownership --test alloc --test channel_skip --test units
          - name: ecs, the rest
            key: ecs-rest
            args: '-p lactose-ecs --lib --test integration -- --skip erased_rows::'
          - name: ecs, doc
            key: ecs-doc
            args: -p lactose-ecs --doc
          # The latest-sample slot's atomics: Miri's weak-memory emulation checks the shipped
          # `Native` orderings, which the loom models (over their own atomics) do not.
          - name: input-host
            key: input-host
            args: -p lactose-input-host
          # The interpolation buffer's sequence lock (crates/net-host): Miri's weak-memory
          # emulation checks the shipped `Native` orderings, which the loom models (over their
          # own atomics) do not, and catches what the hardware stress test misses: with any one
          # of the four orderings weakened, its 150-push test reads torn samples.
          - name: net-host
            key: net-host
            args: '-p lactose-net-host --test integration -- interpolation::'
          # The null RHI backend's threads: its races, its drops that wait for a pending submit
          # and its wakes. As one job it took 24 minutes on a loaded M1, too near the timeout on
          # a runner of unknown speed, so it runs in four: the suite's cases, which take most
          # of the time; null's own integration tests; its unit tests, the fixed interleavings
          # and the drops; and the doc tests, which cargo runs alone (there are none yet). The
          # second and third, where the races and the waiters are, run under four seeds each.
          - name: rhi-null, the suite
            key: rhi-null-suite
            args: '-p lactose-rhi-null --test integration -- conformance::'
          - name: rhi-null, its own
            key: rhi-null-own
            args: '-p lactose-rhi-null --test integration -- --skip conformance::'
            miriflags: -Zmiri-many-seeds=0..4
          - name: rhi-null, unit tests
            key: rhi-null-lib
            args: -p lactose-rhi-null --lib
            miriflags: -Zmiri-many-seeds=0..4
          - name: rhi-null, doc
            key: rhi-null-doc
            args: -p lactose-rhi-null --doc
          # The Vulkan backend's unit tests: its records' fixed interleavings and their race, its
          # holders' count, its handle table and its shader module reads. Nothing here reaches a
          # driver, which Miri cannot load; the device's own paths run in `cargo xtask gpu`.
          - name: rhi-vulkan, unit tests
            key: rhi-vulkan-lib
            args: -p lactose-rhi-vulkan --lib
            miriflags: -Zmiri-many-seeds=0..4
    steps:
      - uses: actions/checkout@v4
      # Miri is the one sanctioned use of a nightly toolchain (architecture section 8.3).
      - run: rustup toolchain install $MIRI_TOOLCHAIN --profile minimal --component miri,rust-src
      # Every entry is the same job, so each takes its own cache key.
      - uses: Swatinem/rust-cache@v2
        with:
          key: miri-${{ matrix.key }}
      # An empty LACTOSE_MIRI_REAL_DEQUE leaves the stand-in deque (crates/task/build.rs).
      - run: cargo +$MIRI_TOOLCHAIN miri test --locked ${{ matrix.args }}
        env:
          LACTOSE_MIRI_REAL_DEQUE: ${{ matrix.real_deque }}
          MIRIFLAGS: ${{ matrix.miriflags }}

  # Architecture section 5.1: the scope latch and the sleep-and-wake protocol are modelled
  # under loom, as are input-host's latest-sample sequence lock and net-host's interpolation
  # slot sequence lock (architecture section 5.3), each switched on by a Cargo feature of its
  # crate and never by a `--cfg` flag in the environment, which would replace the x86-64 pin.
  # Release, because the models' searches are long: every interleaving, or those loom reaches
  # within a preemption bound where a model names one (ten of task's, and input-host's and
  # net-host's).
  loom:
    name: loom
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p lactose-task --features loom --release --locked
      - run: cargo test -p lactose-input-host --features loom --release --locked
      - run: cargo test -p lactose-net-host --features loom --release --locked

  # SOUR, the determinism harness (architecture section 8.3): every mode, on every platform
  # of architecture mode. Each platform also emits its baseline hashes, which the next job
  # compares across platforms.
  #
  # Not wired: the Haswell-masked linux-x64 run of architecture mode, which needs the tests
  # to run under an emulator that hides everything newer than the x86-64-v3 baseline. It is
  # gated at milestone 4 (docs/verification.md, D139). Until then each platform prints its
  # CPU model and feature flags beside its hashes, so the history shows which feature sets
  # have agreed; a comparison that differs between two x86 hosts wires it at once.
  sour:
    name: sour (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x64
          - os: windows-latest
            platform: windows-x64
          - os: macos-latest
            platform: macos-arm64
    steps:
      - uses: actions/checkout@v4
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.151
      # The runner's CPU model and feature flags, in the log and the job summary. They only
      # inform, so neither step can fail the job.
      - name: CPU model and feature flags
        if: runner.os != 'Windows'
        continue-on-error: true
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            model=$(grep -m1 'model name' /proc/cpuinfo | cut -d: -f2-)
            flags=$(grep -m1 '^flags' /proc/cpuinfo | cut -d: -f2-)
          else
            model=$(sysctl -n machdep.cpu.brand_string)
            flags=$(sysctl hw.optional | sed -n 's/^hw\.optional\.\(.*\): 1$/\1/p' | tr '\n' ' ')
          fi
          {
            echo "### CPU of ${{ matrix.platform }}"
            echo
            echo "- model: \`$(echo $model)\`"
            echo "- feature flags: \`$(echo $flags)\`"
          } | tee -a "$GITHUB_STEP_SUMMARY"
      # Windows lists no flags; IsProcessorFeaturePresent answers for the x86 levels that matter
      # against the x86-64-v3 baseline.
      - name: CPU model and feature flags (Windows)
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: pwsh
        run: |
          $model = (Get-CimInstance Win32_Processor).Name.Trim()
          $kernel = Add-Type -PassThru -Name Kernel32 -Namespace Cpu -MemberDefinition @'
          [DllImport("kernel32.dll")] public static extern bool IsProcessorFeaturePresent(uint feature);
          '@
          $names = [ordered]@{ 36 = 'ssse3'; 37 = 'sse4.1'; 38 = 'sse4.2'; 39 = 'avx'; 40 = 'avx2'; 41 = 'avx512f' }
          $flags = ($names.Keys | Where-Object { $kernel::IsProcessorFeaturePresent($_) } | ForEach-Object { $names[$_] }) -join ' '
          $lines = @("### CPU of ${{ matrix.platform }}", '', "- model: ``$model``", "- feature flags (IsProcessorFeaturePresent): ``$flags``")
          $lines | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append
      - name: Build the CI driver
        run: cargo build --locked -p lactose-xtask
      - name: Runner self-test
        run: cargo xtask sour self-test
      - name: Every mode
        run: cargo xtask sour run --nightly --emit sour-hashes-${{ matrix.platform }}.tsv
      # Uploaded whenever the run got far enough to write them, findings or not, so the
      # comparison below sees every platform that produced a file; before the release steps, so
      # a timeout in them cannot cost the dev baseline its upload.
      - name: Keep the baseline hashes
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: sour-hashes-${{ matrix.platform }}
          path: sour-hashes-${{ matrix.platform }}.tsv
      # Every hash above comes from a dev build. The release profile drops debug assertions
      # and overflow checks, so code whose result depends on them would hash differently: one
      # baseline run built with it, held to this platform's dev baseline. It runs whatever the
      # modes above found, and a missing file fails the comparison.
      - name: Release baseline
        if: ${{ !cancelled() }}
        run: cargo xtask sour run --mode architecture --release --emit sour-hashes-release-${{ matrix.platform }}.tsv
      - name: Release against dev
        if: ${{ !cancelled() }}
        run: cargo xtask sour compare sour-hashes-${{ matrix.platform }}.tsv sour-hashes-release-${{ matrix.platform }}.tsv
      # Hash files of every run, and the execution log of any chaos test that failed, so
      # the failure replays exactly.
      - name: Keep SOUR output
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: sour-output-${{ matrix.platform }}
          path: |
            target/sour
            target/sour-release
          if-no-files-found: ignore

  # Architecture mode: the baseline hashes of every platform must be identical. It runs
  # whatever the platform jobs concluded, and a platform that produced no file fails the
  # step that needs it, so a platform cannot drop out of the comparison quietly.
  sour-architecture:
    name: sour (architecture)
    needs: sour
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: actions/download-artifact@v4
        with:
          pattern: sour-hashes-*
          merge-multiple: true
      - name: Build the CI driver
        run: cargo build --locked -p lactose-xtask
      - name: linux-x64 against windows-x64
        if: ${{ !cancelled() }}
        run: cargo xtask sour compare sour-hashes-linux-x64.tsv sour-hashes-windows-x64.tsv
      - name: linux-x64 against macos-arm64
        if: ${{ !cancelled() }}
        run: cargo xtask sour compare sour-hashes-linux-x64.tsv sour-hashes-macos-arm64.tsv

  # docs/verification.md section 1, the milestone 0 spike "io_uring on CI runners": records
  # whether the Linux runner lets a process create a ring. It reports and never fails; the
  # result decides whether `lactose-io` can test its io_uring backend in CI.
  io-uring-probe:
    name: io_uring probe
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Record io_uring availability
        run: |
          python3 - <<'PROBE' | tee -a "$GITHUB_STEP_SUMMARY"
          import ctypes, errno, os, platform

          print("### io_uring on this runner")
          print()
          print(f"- kernel: `{platform.release()}` ({platform.machine()})")
          # 0: enabled for all; 1: only for the io_uring_group; 2: disabled for everyone.
          for path in ("/proc/sys/kernel/io_uring_disabled", "/proc/sys/kernel/io_uring_group"):
              try:
                  with open(path) as file:
                      value = file.read().strip()
              except OSError as error:
                  value = f"unreadable ({error.strerror})"
              print(f"- `{path}`: {value}")
          # io_uring_setup(entries = 4, params): system call 425 on every Linux architecture.
          # The parameter block is 120 bytes and must be zeroed.
          libc = ctypes.CDLL(None, use_errno=True)
          params = ctypes.create_string_buffer(120)
          fd = libc.syscall(425, 4, params)
          if fd >= 0:
              os.close(fd)
              print("- `io_uring_setup`: succeeded, io_uring is usable here")
          else:
              code = ctypes.get_errno()
              name = errno.errorcode.get(code, str(code))
              print(f"- `io_uring_setup`: failed with {name}, io_uring is not usable here")
          PROBE

  # The nightly form of the pull request's `gpu (lavapipe)` job (decision 5.10 of the milestone
  # 2 plan): every device test under GPU-assisted validation, with its own canary
  # (tools/xtask/README.md, "GPU runs"). Assumed from the layer's documentation until the
  # `gpu-probe` below records it: GPU-assisted validation loads on lavapipe, whose features
  # cover what its instrumentation needs, as it does under KosmicKrisp on the M1. On the image
  # the pull request's job pins.
  gpu-assisted:
    name: gpu (lavapipe, GPU-assisted)
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Install lavapipe
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends mesa-vulkan-drivers
      - uses: actions/cache@v4
        with:
          path: target/vulkan-sdk/download
          key: vulkan-sdk-${{ hashFiles('tools/xtask/vulkan-layer.toml') }}
      - name: The device tests under GPU-assisted validation
        run: cargo xtask gpu --driver lavapipe --only vulkan --gpu-assisted
      - uses: actions/upload-artifact@v4
        if: success() || failure()
        with:
          name: gpu-lavapipe-gpu-assisted
          path: target/gpu/lavapipe-vulkan-gpu-assisted.txt
          if-no-files-found: ignore

  # docs/plans/milestone-2.md section 3, `gpu-probe`: what lavapipe on the Linux runner offers,
  # for lane `vulkan` (docs/verification.md, the row on lavapipe). It records and never fails.
  # The macOS runners' facts, the oldest image's included, are the `shaders` jobs' own
  # (tools/xtask/runner-facts.sh). On the image `gpu (lavapipe)` pins.
  gpu-probe:
    name: gpu probe (lavapipe)
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - name: Install lavapipe, vulkaninfo and the validation layer
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends \
            mesa-vulkan-drivers vulkan-tools vulkan-validationlayers
      - name: Record what lavapipe offers
        run: |
          # A fact that is not found is recorded, never a failure.
          set +e -u
          version() { dpkg-query -W -f='${Version}' "$1" 2>/dev/null || echo "not installed"; }
          icd=$(ls /usr/share/vulkan/icd.d/lvp_icd*.json 2>/dev/null | head -1)
          export VK_DRIVER_FILES="$icd"
          vulkaninfo > vulkaninfo.txt 2>&1 || echo "vulkaninfo exited $?" >> vulkaninfo.txt
          {
            echo "### lavapipe on this runner"
            echo
            echo "- system: \`$(uname -srm)\`, $(. /etc/os-release && printf %s "$PRETTY_NAME")"
            echo "- mesa-vulkan-drivers: \`$(version mesa-vulkan-drivers)\`"
            echo "- vulkan-tools: \`$(version vulkan-tools)\`"
            echo "- vulkan-validationlayers: \`$(version vulkan-validationlayers)\`"
            echo "- ICD: \`${icd:-none found}\`"
            echo
            echo "#### Device, extensions and features"
            echo '```'
            grep -E '^\s*(apiVersion|driverVersion|driverName|driverInfo|deviceName|deviceType) *[=:]' vulkaninfo.txt | sort -u
            for name in VK_KHR_dynamic_rendering_local_read VK_EXT_headless_surface \
                VK_KHR_draw_indirect_count VK_EXT_swapchain_maintenance1 VK_KHR_present_wait \
                VK_KHR_present_id VK_EXT_memory_budget VK_KHR_pipeline_binary; do
              if grep -q "$name" vulkaninfo.txt; then echo "$name: offered"; else echo "$name: absent"; fi
            done
            grep -E '^\s*(dynamicRendering|dynamicRenderingLocalRead|synchronization2|timelineSemaphore|bufferDeviceAddress|drawIndirectCount|drawIndirectFirstInstance|multiDrawIndirect|shaderInt64|shaderStorageImageReadWithoutFormat|independentBlend|runtimeDescriptorArray|shaderSampledImageArrayNonUniformIndexing|descriptorBindingPartiallyBound|maintenance4|maintenance5|maintenance6) *=' vulkaninfo.txt | sed 's/^ *//' | sort -u
            echo '```'
            echo
            echo "#### Queue families and memory types"
            echo '```'
            grep -E '^\s*(queueFlags|queueCount|propertyFlags|heapIndex|size) *[=:]' vulkaninfo.txt | sed 's/^ *//'
            echo '```'
            echo
            echo "#### The validation layer"
            echo '```'
            VK_INSTANCE_LAYERS=VK_LAYER_KHRONOS_validation vulkaninfo --summary > layer.txt 2>&1 \
              && echo "loads under VK_INSTANCE_LAYERS: yes" || echo "loads under VK_INSTANCE_LAYERS: no (exit $?)"
            grep -E 'VK_LAYER_KHRONOS_validation' layer.txt | sort -u | head -3
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Keep vulkaninfo's output
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: gpu-probe-lavapipe
          path: |
            vulkaninfo.txt
            layer.txt
          if-no-files-found: warn
