name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Never set the rust flags environment variable here: it would replace the target-feature
  # pin in .cargo/config.toml. `cargo xtask boundary` fails the build if a workflow names it.

# Architecture section 20: a pull request run finishes in fifteen minutes. Every job carries
# that as its timeout, the jobs run in parallel, and the cheap policy checks share one Linux
# job so they pay for one checkout, one cache restore and one build of the CI driver. Windows
# clippy and the Windows release tests have a job of their own, so they run beside the
# Windows debug test build instead of before and after it.
#
# Where each job's budget goes, in minutes, from the three green runs 43548888588 (6443887),
# 43550976114 (6ed8461) and 43556574172 (3264406), each warm. rust-cache restores the
# dependencies; the workspace crates and the vendored rapier3d-f64 are path crates, so every
# run compiles and links them again, and the test builds grow with every crate merged.
# - check (<os>), one job on each platform that built and tested the whole workspace, until
#   the split below. On Windows it took 7.3 to 9.6, median 9.1, from the four green runs since
#   each package's integration tests became one test binary (D150), 43827738169 (d7a0088),
#   43855576989 (eca4e0f), 43868030471 (8941997) and 43872419194 (4ffcd62), each warm, against
#   9.5 to 11.7 in the three before it, 43781979172, 43795852109 and 43799365983; the median of
#   the three most recent warm runs of main stood at 9.2 at a561b36 (43896909697): the test step
#   6.4 to 8.7, its build 4.7 to 6.7 of that and the test run 1.5 to 1.7, doctests 0.2. lld-link
#   (.cargo/config.toml) links. The job reached 14.8 of its 15 in October with clippy and the
#   release tests still in it; they moved to the next job.
# - check (<os>, base) and check (<os>, physics), since the split (milestone 2 plan, decision
#   5.15): each job builds, lints and tests one group of [check_groups] in
#   tools/xtask/ci-policy.toml. Expected on Windows, not yet measured: base about 6.2 and
#   physics about 5.8 of their 15. The arithmetic: the whole test build took 6.5 in 43896909697.
#   Its units, priced at one Apple M1 `cargo --timings` run and scheduled on four slots, take
#   151.8 s; base's take 92.3 s and physics's 91.4 s, physics's bound by the chain through
#   rapier3d-f64. So each half's build is about 4.0 on Windows. The test run, 1.7 for the whole,
#   divides as the tests' summed times do, 224 s of 385 to base and 161 to physics: 1.0 and
#   0.7 (physics's slowest test alone takes 0.6). Add 0.8 for the steps outside the test step and
#   0.4 for `cargo xtask group`. Windows base is the slowest half expected. By the same method
#   from the same three runs (43872419194, 43886836183, 43896909697), each platform's own: on
#   macOS, whose runner has three cores (the halves' builds 0.61 and 0.50 of the whole's on
#   three slots), base about 5.0 and physics about 4.4 (build 3.8, split 2.3 and 1.9; test run
#   2.1, whose summed test times gave base 0.40 and 0.50 of the whole in two of the runs, so
#   1.1 and 1.3 at each half's larger share, physics's slowest test 0.8 to 1.3; the release
#   golden vectors 0.4, in base; clippy 0.3 each; `cargo xtask group` 0.3; the rest 0.6, from
#   the whole job's median of 7.5); on Ubuntu base about 3.1 and physics about 2.8 (build 2.7,
#   split 1.6 and 1.6; test run 0.9, split 0.5 and 0.5; the release golden vectors 0.3, in base;
#   clippy 0.2 each; `cargo xtask group` 0.2; the rest 0.3, from the whole job's median of 4.4).
# - windows-lint-release, 2.6 to 3.6: clippy 0.5 to 0.7, the release golden vectors 1.3 to 2.3.
# - check (ubuntu-latest) and check (macos-latest), before the split: 5.1 to 6.5 on Ubuntu
#   (clippy 0.3, the test step 3.1 to 4.0, the release golden vectors 1.0 to 1.6; it links with
#   lld) and 4.0 to 8.4 on macOS (the test step 4.9 to 5.4, the release golden vectors 1.6 to
#   2.1, clippy 0.5 to 0.6).
# - policy, 0.5 to 0.6: building the CI driver 0.1, the checks under 0.1 each.
# - sour, 3.2 to 4.3: the pull-request modes 2.4 to 2.7, building the harness packages' tests
#   most of it.
# A job that passes 10 of its 15 warm is the signal to split it, before a cold run times out.
#
# rust-cache keys every cache by job ID (its default add-job-id-key), so each job restores and
# saves only its own. No job here may set `shared-key`, which drops the job ID: the Windows
# jobs would then restore and overwrite each other's cache. The two check jobs of a platform
# share a job ID, so each sets `key` to its group, which rust-cache puts ahead of the job ID:
# their caches are `v0-rust-base-check-<os>-...` and `v0-rust-physics-check-<os>-...`, each
# holding the dependencies its own group builds. Both save. A half that restored the other's
# cache would build what that cache lacks on every run, and two halves on one key would race
# to save it. Before the split each platform's one check cache held every dependency, at the
# key of a053a13b 292.6 MB on Linux, 198.8 on macOS and 172.1 on Windows; the two halves hold
# the dependencies they share twice. The repository's cache stood at 10.74 GB at a561b36, over
# GitHub's 10 GB, but GitHub evicts the least recently used entries first, and most of it was
# entries of older keys: the newest entry of each job came to about 2.6 GB. The first run after
# the split restores nothing (no earlier key has the group in it) and builds cold, and no job
# restores a `v0-rust-check-<os>-...` entry again. check and windows-lint-release set
# cache-on-failure, so a cold run that times out late in its build still saves its dependencies.
# But rust-cache saves only when its key missed, so a run on a new key that fails or is
# cancelled before its build finishes leaves a partial entry that later runs restore and never
# replace, until Cargo.lock, a manifest, .cargo/config.toml or the toolchain changes. Recovery:
# `gh cache list --key v0-rust-physics-check-Windows` (or `base`), then `gh cache delete <key>`.
jobs:
  # One job for each package group of [check_groups] in tools/xtask/ci-policy.toml on each
  # platform. A job selects its group's packages with cargo's `-p`, not with a nextest filter,
  # which would still build every package's tests and run only some: the build is most of the
  # job. `cargo xtask group` prints them, and fails the job when the groups leave a package
  # out or name one twice, so the table is the only list. `cargo xtask boundary`, in the policy
  # job, holds this job's head and its Packages, Clippy, Test and Doctests steps to the table,
  # text for text, whatever groups this job runs: an edit to them is an edit to
  # tools/xtask/src/check_groups.rs.
  check:
    name: check (${{ matrix.os }}, ${{ matrix.group }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        group: [base, physics]
    steps:
      - uses: actions/checkout@v5
      # D148: the line-ending rule on this host's own checkout, before anything reads a file.
      # The workflow sets no default shell, and Windows would run PowerShell.
      - name: Line endings
        shell: bash
        run: bash tools/xtask/line-endings.sh
      # rust-toolchain.toml selects the toolchain; rustup installs it on first use.
      - run: rustup show active-toolchain || rustup toolchain install
      # `key` puts the group in the cache key, ahead of the job ID (header).
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.group }}
          cache-on-failure: true
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.151
      # Once, not in each group: it reads every file of the workspace.
      - name: Format
        if: matrix.os == 'ubuntu-latest' && matrix.group == 'base'
        run: cargo fmt --all --check
      # The assignment fails the step when the command does; an `echo` of its output would not.
      - name: Packages
        id: group
        shell: bash
        env:
          GROUP: ${{ matrix.group }}
        run: |
          packages=$(cargo xtask group "$GROUP")
          echo "packages=$packages" >> "$GITHUB_OUTPUT"
      # Windows clippy runs in the windows-lint-release job, beside this job's test build.
      - name: Clippy
        if: matrix.os != 'windows-latest'
        run: cargo clippy ${{ steps.group.outputs.packages }} --all-targets --locked -- -D warnings
      - name: Test
        run: cargo nextest run ${{ steps.group.outputs.packages }} --locked --no-tests=pass
      # nextest does not run doctests; the compile_fail ones pin safety arguments.
      - name: Doctests
        run: cargo test --doc ${{ steps.group.outputs.packages }} --locked
      # What the macOS runner grants a measurement run: the role read-back test prints the
      # user-interactive priority before and after the request, and the class-map tests print
      # the performance levels the runner reports. nextest hides a passing test's output, so
      # this runs them again with it shown (crates/task/README.md, "Measurement calls"), and
      # also when Test failed, the case its output explains.
      - name: Task role and core classes on this runner
        if: ${{ !cancelled() && steps.group.outcome == 'success' && matrix.os == 'macos-latest' && matrix.group == 'base' }}
        run: >-
          cargo nextest run --locked -p lactose-task --no-capture
          -E 'test(=measure::tests::the_foreground_role_is_taken_and_read_back)
          | test(=measure::tests::the_classes_agree_with_the_topology)
          | test(=measure::tests::the_apple_numbering_is_the_device_trees)
          | test(=platform::tests::detected_topology_is_usable)'
      # Release codegen differs from debug; the golden table must hold in both. It runs with
      # the group that holds the three packages. Windows runs it in the windows-lint-release
      # job.
      - name: Math golden vectors (release)
        if: matrix.os != 'windows-latest' && matrix.group == 'base'
        run: cargo nextest run -p lactose-math -p lactose-input -p lactose-input-host --release --locked

  # Clippy and the release golden vectors for Windows, beside the Windows debug test build.
  # Windows clippy matters on its own: cfg-gated code (the executor's core-type query, thread
  # classes) differs from the other two platforms. This job's cache is
  # `v0-rust-windows-lint-release-...` and the check jobs' `v0-rust-<group>-check-...`, so none
  # restores or overwrites another's, and each holds only what its own job builds.
  windows-lint-release:
    name: clippy and release tests (windows-latest)
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.151
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # Runs even if clippy found something, so one run reports both.
      - name: Math golden vectors (release)
        if: success() || failure()
        run: cargo nextest run -p lactose-math -p lactose-input -p lactose-input-host --release --locked

  # The rules that are facts about manifests and files: crate-tiers.toml, the boundary's
  # static checks, the feature trees and cargo-deny. Each step runs even if an earlier one
  # found something, so one run reports everything.
  policy:
    name: policy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      # Pinned: an upgrade is a change of this line, and docs/verification.md's re-check of
      # how cargo-deny treats path sources goes with it.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.20.2
      # The `cargo xtask` alias is `--locked` too, so no later step can rewrite Cargo.lock.
      - name: Build the CI driver
        run: cargo build --locked -p lactose-xtask
      - name: Tier check
        run: cargo xtask tiers
      - name: Boundary checks
        if: success() || failure()
        run: cargo xtask boundary
      - name: Feature trees
        if: success() || failure()
        run: cargo xtask features
      - name: cargo-deny
        if: success() || failure()
        run: cargo deny --locked check
      - name: Vendored crates
        if: success() || failure()
        run: cargo xtask vendor

  # SOUR, the determinism harness (architecture section 8.3): workers mode and one layout
  # capacity on every pull request, over every package listed under [harness] in
  # tools/xtask/ci-policy.toml. The self-test first proves the runner itself on stand-in
  # simulations.
  sour:
    name: sour
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.151
      - name: Build the CI driver
        run: cargo build --locked -p lactose-xtask
      - name: Runner self-test
        run: cargo xtask sour self-test
      - name: Pull-request modes
        run: cargo xtask sour run --pr
      # Hash files of every run, and the execution log of any chaos test that failed.
      - name: Keep SOUR output
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: sour-output
          path: target/sour
          if-no-files-found: ignore

  # The shader runner of criterion 7 (milestone 2 plan, decision 5.8): the engine's shaders
  # cooked with the pinned Slang on both hosts, the two hosts' SPIR-V and MSL compared, and
  # every MSL and metallib made into a pipeline state on macOS, under Metal API and shader
  # validation with their canaries (`cargo xtask gpu`, tools/xtask/README.md). What the runners
  # offer is not assumed: each job first records its Xcode, its `metal`, its `swift` and its
  # system, and a missing one fails the step with a message that names it. Whether a runner has
  # a Metal device is the Metal step's first line, and none fails it.
  shaders:
    name: shaders (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.151
      - name: Runner facts
        shell: bash
        run: bash tools/xtask/runner-facts.sh target/gpu/facts.txt
      # The assignment fails the step when the command does; an `echo` of its output would not.
      - name: Install the pinned Slang
        id: slang
        shell: bash
        run: |
          slangc=$(cargo xtask slang)
          echo "slangc=$slangc" >> "$GITHUB_OUTPUT"
      # On macOS the Metal step's command cooks too: it is what an owner machine runs. A
      # failure of either cook still lets the tests and the hashes below run and report.
      - name: Cook and load the engine shaders
        if: runner.os == 'macOS'
        run: cargo xtask gpu --driver system --only metal
      - name: Cook the engine shaders
        if: runner.os != 'macOS'
        env:
          SLANGC: ${{ steps.slang.outputs.slangc }}
        run: >-
          cargo run --locked --quiet -p lactose-cook --bin ricotta --
          --slangc "$SLANGC" --code target/gpu/code shaders target/gpu/shaders.pack
      # The refusals, the two checkouts' paths, the link-time constant and the load from the
      # pack; the slice measurement is not a check.
      - name: Shader tests
        if: success() || failure()
        run: >-
          cargo nextest run --locked -p lactose-cook --run-ignored only
          -E 'not test(the_shader_kind_loads_against_the_slice)'
      # Every cooked file but the metallibs, which only macOS writes and whose bytes nothing
      # rests on.
      - name: Hashes
        if: success() || failure()
        shell: bash
        run: |
          cd target/gpu/code
          find . -type f ! -name '*.metallib' -print | LC_ALL=C sort | xargs shasum -a 256 > ../hashes.txt
          cat ../hashes.txt
      - uses: actions/upload-artifact@v6
        if: success() || failure()
        with:
          name: shaders-${{ runner.os }}
          path: |
            target/gpu/code
            target/gpu/hashes.txt
            target/gpu/facts.txt
            target/gpu/system-metal.txt
          if-no-files-found: ignore

  # Decision 5.10 of the milestone 2 plan: every device test under lavapipe, the pinned Khronos
  # validation layer and its canaries (`cargo xtask gpu`, tools/xtask/README.md, "GPU runs").
  # The image is pinned, since a runner image change is a driver change. On ubuntu-26.04 the
  # nightly `gpu-probe` recorded (22 November 2026): Ubuntu's `mesa-vulkan-drivers` is Mesa
  # 26.0.8, whose lavapipe offers Vulkan 1.4.335 with `VK_KHR_dynamic_rendering_local_read`,
  # synchronization2, timeline semaphores and buffer device addresses (`bufferDeviceAddress`),
  # and installs one manifest, `lvp_icd.json` in /usr/share/vulkan/icd.d/; it has one queue
  # family of one queue, so compute shares the graphics queue. `mesa-vulkan-drivers` itself is
  # not pinned: the step installs the archive's current one, and the run's file names the Mesa
  # that ran (`DeviceInfo`'s driver). The loader and the layer are the pinned SDK's, whose
  # archive is cached by the pin.
  gpu-lavapipe:
    name: gpu (lavapipe)
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Install lavapipe
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends mesa-vulkan-drivers
      # The download is the Linux archive alone: its url and digest key it, and another
      # host's pin does not.
      - name: The cache key of the Linux archive
        id: archive
        run: |
          pin=$(awk '/^\[/ { linux = ($0 == "[host.linux-x86_64]") } linux && /^(url|sha256) = /' tools/xtask/vulkan-layer.toml)
          test "$(printf '%s\n' "$pin" | wc -l)" -eq 2
          echo "key=vulkan-sdk-$(printf '%s\n' "$pin" | sha256sum | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v5
        with:
          path: target/vulkan-sdk/download
          key: ${{ steps.archive.outputs.key }}
      - name: The device tests under lavapipe
        run: cargo xtask gpu --driver lavapipe --only vulkan
      - uses: actions/upload-artifact@v6
        if: success() || failure()
        with:
          name: gpu-lavapipe
          path: target/gpu/lavapipe-vulkan.txt
          if-no-files-found: ignore

  shaders-compare:
    name: shaders (hashes)
    needs: shaders
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: shaders-*
      - name: The two hosts' SPIR-V and MSL are equal
        shell: bash
        run: |
          if ! diff shaders-Linux/hashes.txt shaders-macOS/hashes.txt; then
            echo "::error::the SPIR-V or MSL cooked on Linux and on macOS differ (lines above)"
            exit 1
          fi

  # The metallibs macOS cooked, loaded on the oldest macOS image the hosted runners offer:
  # macos-15, since macos-14 left them on 2 November 2026. The same Metal step as the cooking
  # runner's, canaries and message count included, on the code it cooked: this runner runs no
  # `metal`, so its facts do not require one.
  shaders-oldest:
    name: shaders (oldest macOS)
    needs: shaders
    if: ${{ !cancelled() }}
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: actions/download-artifact@v7
        with:
          name: shaders-macOS
          path: cooked
      - name: Runner facts
        shell: bash
        run: bash tools/xtask/runner-facts.sh --metal-optional target/gpu/facts.txt
      - name: Load each metallib and MSL
        run: cargo xtask gpu --driver system --only metal --cooked cooked/code
      - uses: actions/upload-artifact@v6
        if: success() || failure()
        with:
          name: gpu-oldest-macOS
          path: |
            target/gpu/facts.txt
            target/gpu/system-metal.txt
          if-no-files-found: ignore
