name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Never set the rust flags environment variable here: it would replace the target-feature
  # pin in .cargo/config.toml. `cargo xtask boundary` fails the build if a workflow names it.

# Architecture section 20: a pull request run finishes in fifteen minutes. Every job carries
# that as its timeout, the jobs run in parallel, and the cheap policy checks share one Linux
# job so they pay for one checkout, one cache restore and one build of the CI driver. Windows
# clippy and the Windows release tests have a job of their own, so they run beside the
# Windows debug test build instead of before and after it.
#
# Where each job's budget goes, in minutes. rust-cache restores the dependencies; the
# workspace crates and the vendored rapier3d-f64 are path crates, so every run compiles and
# links them again, and the Windows test build grows with every crate merged.
# - check (windows-latest). Run 38128490654 (f70c25f), with clippy and the release tests still
#   in it, took 14.8 of its 15: setup 0.7, clippy 1.0, the test step 11.2 (its build 9.9, the
#   run 1.2), doctests 0.1, the release golden vectors 1.3, cache save 0.4. The margin was
#   under a minute warm, and about a minute without clippy. The job grew with each merge: 8.5,
#   7.8, 9.2, 10.1, 11.3, 12.6, a timeout, 14.8. Without clippy and the release tests it is
#   about 12.6, a margin of about 2.4 warm, which the next one or two crate merges use up.
#   The test build runs 1.4 to 2.3 times Linux's, by about as much in its early phase, which
#   links almost nothing, as in its late one, which links the test binaries: the time is
#   rustc's on this runner, not the linker's. lld-link (.cargo/config.toml) takes the part that
#   is the linker's. Its first run rebuilds every dependency, since the linker is part of each
#   unit's fingerprint: an estimated 2 to 3 minutes more, which may time out (see the cache
#   note below). Due now, as its own lane: one integration-test binary per crate.
#   lactose-ecs's 22 built as one took 5.2 s instead of 14 on an M1 at -j4.
# - windows-lint-release, an estimated 3.5 to 4 warm and 6 to 8 cold: setup 0.7 plus the cache
#   restore and save, clippy 1.0 warm (4 to 6 cold), the release golden vectors 1.3.
# - check (ubuntu-latest), 6.4-6.9 in runs 38126112367 and 38126882535: setup 0.3, clippy
#   0.4-1.0, the test build 3.8-4.6, the test run 0.4-0.6, the release golden vectors 0.4-0.6.
#   It links with lld already.
# - check (macos-latest), 2.0-2.6 in the same runs: the test build 1.0-1.3, clippy 0.1-0.5.
# - policy, 0.6-0.7: building the CI driver 0.25, the checks 0.1.
# - sour, 4.2-4.8: the build of the harness packages' tests 2.9, three passes of 0.3 each.
#
# rust-cache keys every cache by job ID (its default add-job-id-key), so each job restores and
# saves only its own. No job here may set `shared-key`, which drops the job ID: the Windows
# jobs would then restore and overwrite each other's cache. check and windows-lint-release set
# cache-on-failure, so a cold run that times out late in its build still saves its dependencies.
# But rust-cache saves only when its key missed, so a run on a new key that fails or is
# cancelled before its build finishes leaves a partial entry that later runs restore and never
# replace, until Cargo.lock, a manifest, .cargo/config.toml or the toolchain changes. Recovery:
# `gh cache list --key v0-rust-check-Windows`, then `gh cache delete <key>`.
jobs:
  check:
    name: check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      # rust-toolchain.toml selects the toolchain; rustup installs it on first use.
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - name: Format
        if: matrix.os == 'ubuntu-latest'
        run: cargo fmt --all --check
      # Windows clippy runs in the windows-lint-release job, beside this job's test build.
      - name: Clippy
        if: matrix.os != 'windows-latest'
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test
        run: cargo nextest run --workspace --locked --no-tests=pass
      # nextest does not run doctests; the compile_fail ones pin safety arguments.
      - name: Doctests
        run: cargo test --doc --workspace --locked
      # Release codegen differs from debug; the golden table must hold in both. Windows runs
      # it in the windows-lint-release job.
      - name: Math golden vectors (release)
        if: matrix.os != 'windows-latest'
        run: cargo nextest run -p lactose-math -p lactose-input -p lactose-input-host --release --locked

  # Clippy and the release golden vectors for Windows, beside the Windows debug test build.
  # Windows clippy matters on its own: cfg-gated code (the executor's core-type query, thread
  # classes) differs from the other two platforms. This job's cache is
  # `v0-rust-windows-lint-release-...` and the test job's `v0-rust-check-...`, so neither
  # restores or overwrites the other's, and each holds only what its own job builds.
  windows-lint-release:
    name: clippy and release tests (windows-latest)
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # Runs even if clippy found something, so one run reports both.
      - name: Math golden vectors (release)
        if: success() || failure()
        run: cargo nextest run -p lactose-math -p lactose-input -p lactose-input-host --release --locked

  # The rules that are facts about manifests and files: crate-tiers.toml, the boundary's
  # static checks, the feature trees and cargo-deny. Each step runs even if an earlier one
  # found something, so one run reports everything.
  policy:
    name: policy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      # The `cargo xtask` alias is `--locked` too, so no later step can rewrite Cargo.lock.
      - name: Build the CI driver
        run: cargo build --locked -p lactose-xtask
      - name: Tier check
        run: cargo xtask tiers
      - name: Boundary checks
        if: success() || failure()
        run: cargo xtask boundary
      - name: Feature trees
        if: success() || failure()
        run: cargo xtask features
      - name: cargo-deny
        if: success() || failure()
        run: cargo deny --locked check
      - name: Vendored crates
        if: success() || failure()
        run: cargo xtask vendor
      # Features unify across a build, so one crate enabling `lactose-task/loom` would switch
      # every executor to loom primitives, which panic outside a model. Only the root manifest
      # (the version), `crates/task` and input-host's own optional `loom` feature and
      # dependency may name loom; input-host's feature only builds its models and changes
      # nothing it ships, and no other line of its manifest may mention loom.
      - name: Nothing enables the loom feature
        if: success() || failure()
        run: |
          if grep -rn --include=Cargo.toml loom crates tools | grep -v -e '^crates/task/' \
               -e '^crates/input-host/Cargo.toml:[0-9]*:#' \
               -e '^crates/input-host/Cargo.toml:[0-9]*:loom = \["dep:loom"]$' \
               -e '^crates/input-host/Cargo.toml:[0-9]*:loom = { workspace = true, optional = true }$'; then
            echo "only crates/task and input-host's optional loom feature may name loom"; exit 1
          fi

  # SOUR, the determinism harness (architecture section 8.3): workers mode and one layout
  # capacity on every pull request. The self-test proves the runner itself on stand-in
  # simulations, which is all there is to run until a package is listed under [harness] in
  # tools/xtask/ci-policy.toml.
  sour:
    name: sour
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - name: Build the CI driver
        run: cargo build --locked -p lactose-xtask
      - name: Runner self-test
        run: cargo xtask sour self-test
      - name: Pull-request modes
        run: cargo xtask sour run --pr
      # Hash files of every run, and the execution log of any chaos test that failed.
      - name: Keep SOUR output
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: sour-output
          path: target/sour
          if-no-files-found: ignore
