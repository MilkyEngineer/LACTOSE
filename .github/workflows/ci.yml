name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Never set the rust flags environment variable here: it would replace the target-feature
  # pin in .cargo/config.toml. `cargo xtask boundary` fails the build if a workflow names it.

# Architecture section 20: a pull request run finishes in fifteen minutes. Every job carries
# that as its timeout, the three jobs run in parallel, and the cheap policy checks share one
# Linux job so they pay for one checkout, one cache restore and one build of the CI driver.
#
# Where each job's budget goes, in minutes, from runs 38126112367 and 38126882535 (105 and 110
# test binaries). rust-cache restores the dependencies; the workspace crates and the vendored
# rapier3d-f64 are path crates, so every run compiles and links them again.
# - check (windows-latest), 12.5 in the one whole run, then over 15: setup 0.5-1.3, clippy
#   0.8-1.9, the test build 7.0-9.4 (the same commit took both on two runners), the test run
#   0.8-1.3, doctests 0.1, the release golden vectors 0.9-1.2, cache save 0.2. The test build
#   runs 1.4 to 2.3 times Linux's, by about as much in its early phase, which links almost
#   nothing, as in its late one, which links the test binaries: the time is rustc's on this
#   runner, not the linker's. lld-link (.cargo/config.toml) replaces link.exe for the part
#   that is the linker's.
# - check (ubuntu-latest), 6.4-6.9: setup 0.3, clippy 0.4-1.0, the test build 3.8-4.6, the
#   test run 0.4-0.6, the release golden vectors 0.4-0.6. It links with lld already.
# - check (macos-latest), 2.0-2.6: the test build 1.0-1.3, clippy 0.1-0.5.
# - policy, 0.6-0.7: building the CI driver 0.25, the checks 0.1.
# - sour, 4.2-4.8: the build of the harness packages' tests 2.9, three passes of 0.3 each.
jobs:
  check:
    name: check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      # rust-toolchain.toml selects the toolchain; rustup installs it on first use.
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - name: Format
        if: matrix.os == 'ubuntu-latest'
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test
        run: cargo nextest run --workspace --locked --no-tests=pass
      # nextest does not run doctests; the compile_fail ones pin safety arguments.
      - name: Doctests
        run: cargo test --doc --workspace --locked
      # Release codegen differs from debug; the golden table must hold in both.
      - name: Math golden vectors (release)
        run: cargo nextest run -p lactose-math -p lactose-input --release --locked

  # The rules that are facts about manifests and files: crate-tiers.toml, the boundary's
  # static checks, the feature trees and cargo-deny. Each step runs even if an earlier one
  # found something, so one run reports everything.
  policy:
    name: policy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      # The `cargo xtask` alias is `--locked` too, so no later step can rewrite Cargo.lock.
      - name: Build the CI driver
        run: cargo build --locked -p lactose-xtask
      - name: Tier check
        run: cargo xtask tiers
      - name: Boundary checks
        if: success() || failure()
        run: cargo xtask boundary
      - name: Feature trees
        if: success() || failure()
        run: cargo xtask features
      - name: cargo-deny
        if: success() || failure()
        run: cargo deny --locked check
      - name: Vendored crates
        if: success() || failure()
        run: cargo xtask vendor
      # Features unify across a build, so one crate enabling `lactose-task/loom` would switch
      # every executor to loom primitives, which panic outside a model. Only the root manifest
      # (the version) and `crates/task` may name loom.
      - name: Nothing enables the loom feature
        if: success() || failure()
        run: |
          if grep -rn --include=Cargo.toml loom crates tools | grep -v '^crates/task/'; then
            echo "only crates/task may name loom"; exit 1
          fi

  # SOUR, the determinism harness (architecture section 8.3): workers mode and one layout
  # capacity on every pull request. The self-test proves the runner itself on stand-in
  # simulations, which is all there is to run until a package is listed under [harness] in
  # tools/xtask/ci-policy.toml.
  sour:
    name: sour
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - name: Build the CI driver
        run: cargo build --locked -p lactose-xtask
      - name: Runner self-test
        run: cargo xtask sour self-test
      - name: Pull-request modes
        run: cargo xtask sour run --pr
      # Hash files of every run, and the execution log of any chaos test that failed.
      - name: Keep SOUR output
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: sour-output
          path: target/sour
          if-no-files-found: ignore
