name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Never set the rust flags environment variable here: it would replace the target-feature
  # pin in .cargo/config.toml. `cargo xtask boundary` fails the build if a workflow names it.

# Architecture section 20: a pull request run finishes in fifteen minutes. Every job carries
# that as its timeout, the jobs run in parallel, and the cheap policy checks share one Linux
# job so they pay for one checkout, one cache restore and one build of the CI driver. Windows
# clippy and the Windows release tests have a job of their own, so they run beside the
# Windows debug test build instead of before and after it.
#
# Where each job's budget goes, in minutes, from the three green runs 43548888588 (6443887),
# 43550976114 (6ed8461) and 43556574172 (3264406), each warm. rust-cache restores the
# dependencies; the workspace crates and the vendored rapier3d-f64 are path crates, so every
# run compiles and links them again, and the test builds grow with every crate merged.
# - check (windows-latest), 7.3 to 9.6, median 9.1, from the four green runs since each
#   package's integration tests became one test binary (D150), 43827738169 (d7a0088),
#   43855576989 (eca4e0f), 43868030471 (8941997) and 43872419194 (4ffcd62), each warm, against
#   9.5 to 11.7 in the three before it, 43781979172, 43795852109 and 43799365983: the test
#   step 6.4 to 8.7 (its build most of it), doctests 0.2. lld-link (.cargo/config.toml) links.
#   The job reached 14.8 of its 15 in October with clippy and the release tests still in it;
#   they moved to the next job.
# - windows-lint-release, 2.6 to 3.6: clippy 0.5 to 0.7, the release golden vectors 1.3 to 2.3.
# - check (ubuntu-latest), 5.1 to 6.5: clippy 0.3, the test step 3.1 to 4.0, the release golden
#   vectors 1.0 to 1.6. It links with lld.
# - check (macos-latest), 4.0 to 8.4: the test step 4.9 to 5.4, the release golden vectors
#   1.6 to 2.1, clippy 0.5 to 0.6.
# - policy, 0.5 to 0.6: building the CI driver 0.1, the checks under 0.1 each.
# - sour, 3.2 to 4.3: the pull-request modes 2.4 to 2.7, building the harness packages' tests
#   most of it.
# A job that passes 10 of its 15 warm is the signal to split it, before a cold run times out.
#
# rust-cache keys every cache by job ID (its default add-job-id-key), so each job restores and
# saves only its own. No job here may set `shared-key`, which drops the job ID: the Windows
# jobs would then restore and overwrite each other's cache. check and windows-lint-release set
# cache-on-failure, so a cold run that times out late in its build still saves its dependencies.
# But rust-cache saves only when its key missed, so a run on a new key that fails or is
# cancelled before its build finishes leaves a partial entry that later runs restore and never
# replace, until Cargo.lock, a manifest, .cargo/config.toml or the toolchain changes. Recovery:
# `gh cache list --key v0-rust-check-Windows`, then `gh cache delete <key>`.
jobs:
  # One job for each package group of [check_groups] in tools/xtask/ci-policy.toml on each
  # platform. A job selects its group's packages with cargo's `-p`, not with a nextest filter,
  # which would still build every package's tests and run only some: the build is most of the
  # job. `cargo xtask group` prints them, and fails the job when the groups leave a package
  # out or name one twice, so the table is the only list.
  check:
    name: check (${{ matrix.os }}, ${{ matrix.group }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        group: [foundation, simulation]
    steps:
      - uses: actions/checkout@v4
      # D148: the line-ending rule on this host's own checkout, before anything reads a file.
      # The workflow sets no default shell, and Windows would run PowerShell.
      - name: Line endings
        shell: bash
        run: bash tools/xtask/line-endings.sh
      # rust-toolchain.toml selects the toolchain; rustup installs it on first use.
      - run: rustup show active-toolchain || rustup toolchain install
      # `key` puts the group in the cache key, ahead of the job ID (header).
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.group }}
          cache-on-failure: true
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.151
      # Once, not in each group: it reads every file of the workspace.
      - name: Format
        if: matrix.os == 'ubuntu-latest' && matrix.group == 'foundation'
        run: cargo fmt --all --check
      # The assignment fails the step when the command does; an `echo` of its output would not.
      - name: Packages
        id: group
        shell: bash
        env:
          GROUP: ${{ matrix.group }}
        run: |
          packages=$(cargo xtask group "$GROUP")
          echo "packages=$packages" >> "$GITHUB_OUTPUT"
      # Windows clippy runs in the windows-lint-release job, beside this job's test build.
      - name: Clippy
        if: matrix.os != 'windows-latest'
        run: cargo clippy ${{ steps.group.outputs.packages }} --all-targets --locked -- -D warnings
      - name: Test
        run: cargo nextest run ${{ steps.group.outputs.packages }} --locked --no-tests=pass
      # nextest does not run doctests; the compile_fail ones pin safety arguments.
      - name: Doctests
        run: cargo test --doc ${{ steps.group.outputs.packages }} --locked
      # Release codegen differs from debug; the golden table must hold in both. It runs with
      # the group that holds the three packages. Windows runs it in the windows-lint-release
      # job.
      - name: Math golden vectors (release)
        if: matrix.os != 'windows-latest' && matrix.group == 'foundation'
        run: cargo nextest run -p lactose-math -p lactose-input -p lactose-input-host --release --locked

  # Clippy and the release golden vectors for Windows, beside the Windows debug test build.
  # Windows clippy matters on its own: cfg-gated code (the executor's core-type query, thread
  # classes) differs from the other two platforms. This job's cache is
  # `v0-rust-windows-lint-release-...` and the check jobs' `v0-rust-<group>-check-...`, so none
  # restores or overwrites another's, and each holds only what its own job builds.
  windows-lint-release:
    name: clippy and release tests (windows-latest)
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.151
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # Runs even if clippy found something, so one run reports both.
      - name: Math golden vectors (release)
        if: success() || failure()
        run: cargo nextest run -p lactose-math -p lactose-input -p lactose-input-host --release --locked

  # The rules that are facts about manifests and files: crate-tiers.toml, the boundary's
  # static checks, the feature trees and cargo-deny. Each step runs even if an earlier one
  # found something, so one run reports everything.
  policy:
    name: policy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      # Pinned: an upgrade is a change of this line, and docs/verification.md's re-check of
      # how cargo-deny treats path sources goes with it.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.20.2
      # The `cargo xtask` alias is `--locked` too, so no later step can rewrite Cargo.lock.
      - name: Build the CI driver
        run: cargo build --locked -p lactose-xtask
      - name: Tier check
        run: cargo xtask tiers
      - name: Boundary checks
        if: success() || failure()
        run: cargo xtask boundary
      - name: Feature trees
        if: success() || failure()
        run: cargo xtask features
      - name: cargo-deny
        if: success() || failure()
        run: cargo deny --locked check
      - name: Vendored crates
        if: success() || failure()
        run: cargo xtask vendor

  # SOUR, the determinism harness (architecture section 8.3): workers mode and one layout
  # capacity on every pull request, over every package listed under [harness] in
  # tools/xtask/ci-policy.toml. The self-test first proves the runner itself on stand-in
  # simulations.
  sour:
    name: sour
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.151
      - name: Build the CI driver
        run: cargo build --locked -p lactose-xtask
      - name: Runner self-test
        run: cargo xtask sour self-test
      - name: Pull-request modes
        run: cargo xtask sour run --pr
      # Hash files of every run, and the execution log of any chaos test that failed.
      - name: Keep SOUR output
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: sour-output
          path: target/sour
          if-no-files-found: ignore
