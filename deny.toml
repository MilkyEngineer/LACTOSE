# cargo-deny configuration (architecture sections 8.2, 8.3 and 20). CI runs `cargo deny check`.
#
# cargo-deny carries the workspace-wide dependency rules. Two rules of section 8.2 that it
# cannot express are enforced by `cargo xtask boundary` instead: the dependency allowlist per
# boundary crate (the boundary tables of crate-tiers.toml) and the ban on RUSTFLAGS and on any
# target CPU or target feature other than the x86-64-v3 pin.
#
# A crate built from a patched copy under vendor/ (architecture section 8.2, D123) keeps its
# name and version, so [bans] and [licenses] match it as they match the registry build and
# [sources] sees no path source. The advisories check skips a path source, so `cargo xtask
# vendor` runs it over the upstream versions in a manifest it writes under target/.

[graph]
# Every platform CI builds for, so a platform-specific dependency is checked from any machine.
targets = [
  "x86_64-unknown-linux-gnu",
  "x86_64-pc-windows-msvc",
  "aarch64-apple-darwin",
]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = []

[licenses]
version = 2
# LACTOSE is MIT-licensed, but a game built on it may ship as a closed-source binary that
# statically links its dependencies. The list is therefore the permissive licences only: each
# allows that, asking at most for attribution in the shipped notices. Nothing copyleft is on
# it, weak copyleft included (MPL-2.0, LGPL), so such a dependency is a decision somebody makes
# here, not something a `cargo add` brings in.
#
#   MIT, Apache-2.0, BSD-2-Clause, BSD-3-Clause, ISC, Zlib, BSL-1.0: attribution only.
#   Apache-2.0 WITH LLVM-exception: Apache-2.0 with the notice duty waived for compiled output.
#   Unicode-3.0: the Unicode data tables in `unicode-ident`; attribution only.
#   CC0-1.0, 0BSD: no conditions.
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "BSL-1.0",
  "Unicode-3.0",
  "CC0-1.0",
  "0BSD",
]
confidence-threshold = 0.9
# The list is a policy, not a census of today's tree, so an entry nothing uses yet is fine.
unused-allowed-license = "allow"

[licenses.private]
# The workspace's own crates are `publish = false` and inherit `license = "MIT"` from the root
# `[workspace.package]`. They are checked like any crate, so one without the field fails.
ignore = false

[bans]
# Two versions of one crate are a warning in general. Outside the determinism boundary a
# duplicate costs build time and binary size, not correctness, and the platform crates that
# arrive with the windowing and graphics backends (`windows-sys` and its relatives) duplicate
# routinely; denying them all would turn this file into a list of `skip` entries. The crates
# for which a duplicate is a correctness bug are denied individually below.
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
highlight = "all"

deny = [
  # Architecture section 8.2: simulation and physics share one `libm`, so two builds of the
  # boundary cannot disagree on a transcendental.
  { crate = "libm", deny-multiple-versions = true },
  # Every crate Rapier's math depends on (section 8.2, D119): two builds of any of them in
  # one binary could put two numerics into one simulation.
  { crate = "glam", deny-multiple-versions = true },
  { crate = "glamx", deny-multiple-versions = true },
  { crate = "wide", deny-multiple-versions = true },
  { crate = "safe_arch", deny-multiple-versions = true },
  { crate = "simba", deny-multiple-versions = true },
  { crate = "nalgebra", deny-multiple-versions = true },
  { crate = "parry3d-f64", deny-multiple-versions = true },
  { crate = "rapier3d-f64", deny-multiple-versions = true },
  { crate = "num-traits", deny-multiple-versions = true },
]

# glam features that change numerics (docs/verification.md section 2).
#
# Checked against glam 0.33.12 (the line `glamx` 0.3.1 requires) and 0.34.0:
#   scalar-math  replaces the SIMD back-end with scalar code;
#   core-simd    replaces it with nightly portable SIMD;
#   libm, nostd-libm  switch transcendentals between the platform library and `libm`;
#   fast-math    0.33 only; a no-op since 0.33.8, removed in 0.34.0, banned so an older
#                0.33 can never bring it back to life.
# Rapier 0.36.0's `enhanced-determinism` turns `scalar-math`, `libm` and `nostd-libm` on
# itself (through parry3d-f64 and glamx), which section 8.2 accepts, so those three are not
# denied; the rule still stops any crate from turning on the remaining two.
[[bans.features]]
crate = "glam"
deny = ["fast-math", "core-simd"]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
