[package]
name = "lactose-asset-api"
description = "Asset identity, typed references, version tables, handles, loader and processor traits, the store trait and its conformance suite."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
# The conformance suite every `AssetStore` must pass, and the in-memory reference store the
# suite is tested against. A backend enables it from its dev-dependencies only.
conformance = []

[dependencies]
bytemuck.workspace = true
lactose-core.workspace = true

[dev-dependencies]
# Turns the suite on for this crate's own tests.
lactose-asset-api = { path = ".", features = ["conformance"] }

[lints]
workspace = true
