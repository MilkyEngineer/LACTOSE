[package]
name = "lactose-task"
description = "Work-stealing executor: continuation-counted graphs, in-job fork-join, worker classes, thread lanes."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
autotests = false

[features]
# Switches the internal `sync` shim to loom's model-checked primitives so the scope latch and
# the sleep-and-wake protocol can be explored exhaustively. Run the models with
# `cargo test -p lactose-task --features loom --release`; never with `RUSTFLAGS="--cfg loom"`.
#
# This feature is for that one command. No other crate may enable it, and nothing may be
# built with `--all-features`: features unify across a build, so every executor in it would
# be switched to loom primitives, which panic outside a loom model.
loom = ["dep:loom"]

[dependencies]
crossbeam-deque.workspace = true
lactose-core.workspace = true
loom = { workspace = true, optional = true }
tracing.workspace = true

[target.'cfg(target_vendor = "apple")'.dependencies]
libc.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
] }

[dev-dependencies]
zstd.workspace = true

[target.'cfg(unix)'.dev-dependencies]
libc.workspace = true

# The benchmark's process CPU on Windows (`QueryProcessCycleTime`).
[target.'cfg(windows)'.dev-dependencies]
windows-sys = { workspace = true, features = ["Win32_System_WindowsProgramming"] }

[[bench]]
name = "whisk"
harness = false

# The integration tests as one test binary, whose root declares the files of tests/ as
# modules (D150).
[[test]]
name = "integration"
path = "tests/integration.rs"

# A binary of its own ([test_targets] in tools/xtask/ci-policy.toml): it measures the
# process's CPU time, which every test of one binary adds to under `cargo test`.
[[test]]
name = "idle_cpu"
path = "tests/idle_cpu.rs"

# A binary of its own ([test_targets] in tools/xtask/ci-policy.toml): it installs the
# process's tracing subscriber, which every test of one binary shares under `cargo test`
# and `cargo miri test`.
[[test]]
name = "spans"
path = "tests/spans.rs"

[lints]
workspace = true
