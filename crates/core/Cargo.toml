[package]
name = "lactose-core"
description = "Identity keys, handles, deterministic maps, arenas, the tagged allocator, the error taxonomy and thread classes."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
bytemuck.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_System_Threading"] }

[dev-dependencies]
xxhash-rust = { workspace = true, features = ["xxh64"] }

# The thread-class test reads the system's build to know whether it can read a thread's
# power-throttling state back.
[target.'cfg(windows)'.dev-dependencies]
windows-sys = { workspace = true, features = ["Wdk_System_SystemServices", "Win32_System_SystemInformation"] }

[lints]
workspace = true
