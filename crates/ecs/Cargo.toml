[package]
name = "lactose-ecs"
description = "Entities, archetypes, chunks, change ticks, the structural log, queries, the schedule, command buffers and the system macro."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
autotests = false

[dependencies]
bytemuck.workspace = true
# Row records for bulk copy (architecture section 15.2).
lactose-bundle.workspace = true
lactose-core.workspace = true
lactose-ecs-macros.workspace = true
lactose-math.workspace = true
# Metadata only (architecture section 8.1): the registry, visitors and policies.
lactose-reflect.workspace = true
# Execution only (architecture section 8.2): every result is order-independent.
lactose-task.workspace = true
# Dropped commands and spans at target `casein` (architecture sections 3 and 19).
tracing.workspace = true
# Types only: the exact-version asset table a region holds.
lactose-asset-api.workspace = true

# The integration tests as one test binary, whose root declares the files of tests/ as
# modules (D125).
[[test]]
name = "integration"
path = "tests/integration.rs"

# A binary of its own ([test_targets] in tools/xtask/ci-policy.toml): its `#[global_allocator]`
# would count every other test's allocations too in the package's one binary.
[[test]]
name = "alloc"
path = "tests/alloc.rs"

[lints]
workspace = true
