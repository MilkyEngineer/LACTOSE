[package]
name = "lactose-persist"
description = "Saves: the world overlay diffed from a region's export against its cooked baseline, the save container, and schema migrations."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
# `CheckedBitPattern` and `NoUninit` for the typed field reads and writes a migration makes.
bytemuck.workspace = true
# `PinnedTable` and `VersionTable`, which the bundle and the message this crate builds
# carry; types only.
lactose-asset-api.workspace = true
# The record format of architecture section 15.2: baselines, overlays and their schemas.
lactose-bundle.workspace = true
lactose-core.workspace = true
# The export this crate diffs (`RegionRows`, `ExportedRow`), the ownership component the
# export carries beside each row, and the region identity; types only.
lactose-ecs.workspace = true
# The one scalar type whose canonical bits this crate writes (architecture section 8.2);
# no arithmetic.
lactose-math.workspace = true
# `RegionRelevance`, the message a region's records become on the server (architecture
# section 9.3): built here so the save and the message share one rule; types only.
lactose-net-api.workspace = true
# Metadata only: the registry, each type's description and its persistence policy.
lactose-reflect.workspace = true
# `RegionExport` and `SavePoint`, the input of a save, and `RegionBundle`, the output of a
# load; types only.
lactose-sim.workspace = true
# Each section of the container is one zstd frame (architecture section 15.3).
zstd.workspace = true

[dev-dependencies]
# The reload tests record under SOUR and build their executor as a SOUR test does
# (`ChaosConfig`); a dev-dependency, so the library names nothing of `task`.
lactose-task.workspace = true
# Section 15.5's tests with physics components: the bodies, the sync and the test backend of
# its own tests (`tests/physics.rs` includes them by path).
lactose-physics-api.workspace = true
# The included test backend logs what it ignores.
tracing.workspace = true

[lints]
workspace = true
