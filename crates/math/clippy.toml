disallowed-types = [
  { path = "std::time::Instant", reason = "no wall-clock time inside the boundary" },
  { path = "std::time::SystemTime", reason = "no wall-clock time inside the boundary" },
  { path = "std::collections::HashMap", reason = "use lactose_core::FixedHashMap" },
  { path = "std::collections::HashSet", reason = "randomly seeded; iteration order is observable" },
  { path = "std::hash::RandomState", reason = "randomly seeded" },
  { path = "hashbrown::HashMap", reason = "use lactose_core::FixedHashMap", allow-invalid = true },
  { path = "hashbrown::HashSet", reason = "iteration order is observable", allow-invalid = true },
  # Bans `thread_local!` through the type it declares. The `disallowed-macros` lint cannot
