  { path = "f64::mul_add", reason = "result depends on the caller's target features; use lactose_math::Scalar::mul_add" },
  # Architecture section 8.2: the worker index is never a semantic key. `lactose-ecs` keeps
  # per-slot partials and opts out at those call sites, item by item, like `lactose-math` does
  # for the float methods.
  { path = "lactose_task::JobContext::slot", reason = "the worker index is not a semantic key; key by StableKey", allow-invalid = true },
  { path = "lactose_task::ChildContext::slot", reason = "the worker index is not a semantic key; key by StableKey", allow-invalid = true },
  # Architecture section 8.2: `lactose_ecs` re-exports the executor so that a boundary crate
  # can drive a schedule, and the re-export reaches every boundary crate. What one may do
  # with it is run a schedule. The worker count, spawning or running arbitrary work, thread
  # creation, a deadline, the scheduling history and its configuration are banned;
  # `lactose-ecs` opts out at its one `run_graph` call site, item by item, like `lactose-math`
  # does for the float methods.
  { path = "lactose_task::Executor::frame_worker_count", reason = "the worker count is not a semantic key; key by StableKey", allow-invalid = true },
  { path = "lactose_task::Executor::slot_count", reason = "the worker count is not a semantic key; key by StableKey", allow-invalid = true },
  { path = "lactose_task::Executor::spawn", reason = "a boundary crate runs schedules, not arbitrary tasks", allow-invalid = true },
  { path = "lactose_task::Executor::run_graph", reason = "a boundary crate runs schedules through lactose_ecs::Schedule, not graphs", allow-invalid = true },
  { path = "lactose_task::Executor::platform", reason = "a boundary crate creates no thread", allow-invalid = true },
  { path = "lactose_task::Executor::sleep_until", reason = "no wall-clock time inside the boundary", allow-invalid = true },
  { path = "lactose_task::Executor::execution_log", reason = "scheduling history is not simulation input", allow-invalid = true },
  { path = "lactose_task::Executor::chaos_config", reason = "scheduling configuration is not simulation input", allow-invalid = true },
  # D119: nalgebra hands products above its small-dimension cutoff to `matrixmultiply`,
  # whose kernels are selected by CPU feature at run time. The step forms none; inverse
  # kinematics does, so it is banned (paths on the pinned rapier3d-f64 0.36.0).
  { path = "rapier3d_f64::dynamics::Multibody::inverse_kinematics", reason = "reaches matrixmultiply, whose kernels are chosen by CPU feature", allow-invalid = true },
  { path = "rapier3d_f64::dynamics::Multibody::inverse_kinematics_delta", reason = "reaches matrixmultiply, whose kernels are chosen by CPU feature", allow-invalid = true },
  { path = "rapier3d_f64::dynamics::Multibody::inverse_kinematics_delta_with_jacobian", reason = "reaches matrixmultiply, whose kernels are chosen by CPU feature", allow-invalid = true },
  # A multibody's mass assembly reaches it too above five degrees of freedom, so no boundary
  # crate inserts a multibody joint.
  { path = "rapier3d_f64::dynamics::MultibodyJointSet::insert", reason = "multibody mass assembly reaches matrixmultiply, whose kernels are chosen by CPU feature", allow-invalid = true },
  { path = "rapier3d_f64::dynamics::MultibodyJointSet::insert_kinematic", reason = "multibody mass assembly reaches matrixmultiply, whose kernels are chosen by CPU feature", allow-invalid = true },
  # Architecture section 8.2: file IO (`io`), the process environment, subprocesses and the
  # network (`net-host`) are outside the boundary; what a simulation reads enters as a tick
  # input. Clippy matches items, not modules, so each module is closed here by its free
  # functions and the methods of `Path` that touch the file system, and under
  # disallowed-types by its types with constructors, with the platform extensions that open
  # the same doors. The environment includes what the process learns of itself: standard
  # input, its ids, whether it has a terminal, the working directory behind
  # `path::absolute`, the core count and the backtrace variables. A test that reads a file
  # or a variable lifts the lint with `#[expect]` on its one item.
  { path = "std::fs::canonicalize", reason = "architecture section 8.2: file IO is outside the boundary; what the simulation reads enters as a tick input" },
