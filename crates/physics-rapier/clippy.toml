disallowed-types = [
  { path = "std::time::Instant", reason = "no wall-clock time inside the boundary" },
  { path = "std::time::SystemTime", reason = "no wall-clock time inside the boundary" },
  { path = "std::collections::HashMap", reason = "use lactose_core::FixedHashMap" },
  { path = "std::collections::HashSet", reason = "randomly seeded; iteration order is observable" },
  { path = "std::hash::RandomState", reason = "randomly seeded" },
  { path = "hashbrown::HashMap", reason = "use lactose_core::FixedHashMap", allow-invalid = true },
  { path = "hashbrown::HashSet", reason = "iteration order is observable", allow-invalid = true },
  # Bans `thread_local!` through the type it declares. The `disallowed-macros` lint cannot
  # be used for it: on the pinned toolchain a local `expect` does not reach an item macro.
  { path = "std::thread::LocalKey", reason = "no thread-local state inside the boundary" },
  # Section 16: rayon's adaptors bridge a parallel iterator onto the current pool, the global
  # one off the solver pool. They are not banned, being of no use without a parallel iterator:
  # the iterators rayon makes are banned at their sources (under disallowed-methods), and one
  # of a crate's own is written with these traits, its `drive` methods bounded by the consumer
  # traits. This lint catches a trait in a bound or a named import, not in an impl header, a
  # glob import or an expression path; an iterator cannot be written without the bounds.
  { path = "rayon::iter::plumbing::Producer", reason = "architecture section 16: off the solver pool, rayon starts its global pool, sized by the core count", allow-invalid = true },
  { path = "rayon::iter::plumbing::UnindexedProducer", reason = "architecture section 16: off the solver pool, rayon starts its global pool, sized by the core count", allow-invalid = true },
