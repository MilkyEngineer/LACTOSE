  { path = "rayon::iter::plumbing::UnindexedConsumer", reason = "architecture section 16: off the solver pool, rayon starts its global pool, sized by the core count", allow-invalid = true },
  # Architecture section 8.2: the types that open a file or a socket or start a process; the
  # free functions are under disallowed-methods.
  { path = "std::fs::File", reason = "architecture section 8.2: file IO is outside the boundary; what the simulation reads enters as a tick input" },
  { path = "std::fs::OpenOptions", reason = "architecture section 8.2: file IO is outside the boundary; what the simulation reads enters as a tick input" },
  { path = "std::fs::DirBuilder", reason = "architecture section 8.2: file IO is outside the boundary; what the simulation reads enters as a tick input" },
