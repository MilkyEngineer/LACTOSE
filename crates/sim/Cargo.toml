[package]
name = "lactose-sim"
description = "The deterministic simulation over a world and its schedules: region lifecycle, the input sync point, the tick step, time scale and the world hash."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
# Types only (architecture section 8.2): the exact-version asset table a region receives and
# the failure value the input sync point tick-stamps.
lactose-asset-api.workspace = true
# Row records for region loads and exports (architecture section 15.2).
lactose-bundle.workspace = true
lactose-core.workspace = true
# The world, the schedules and, through its re-export, the executor: execution only
# (architecture section 8.2).
lactose-ecs.workspace = true
lactose-math.workspace = true
# Metadata only (architecture section 8.1): the registry, and the field visitors the world
# hasher implements.
lactose-reflect.workspace = true

[lints]
workspace = true
