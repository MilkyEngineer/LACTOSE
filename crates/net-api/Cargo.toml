[package]
name = "lactose-net-api"
description = "Network contracts: the staged frame a client applies, the frame the replication gather fills, the relevance message, quantised wire values, the handshake, the transport trait, per-connection handles and interest state, and the lock-free interpolation buffer."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
# `Pod` for the wire-shaped plain data: handles, quantised values, the handshake.
bytemuck.workspace = true
# Types only: the version table a relevance message carries, the failure a resync names.
lactose-asset-api.workspace = true
# The overlay a relevance message carries, and the component bytes a spawn carries.
lactose-bundle.workspace = true
lactose-core.workspace = true
# The world the hooks write and the gather reads, `ChangeMark`, `LogCursor`, the structural
# log's entries, and the `#[system]` attribute for the gather.
lactose-ecs.workspace = true
# Quantisation through the simulation scalar (architecture section 8.2), and the vectors
# and quaternions the interpolation buffer holds and samples.
lactose-math.workspace = true
# `#[component]`, `#[value]`, and the registry the protocol hash covers.
lactose-reflect.workspace = true
# `StagedState`, `RegionBundle`, `RegionExport`, `Pass::Gather`, `TimeScale`,
# `AssetFailureEvent` and the registration surface.
lactose-sim.workspace = true

[lints]
workspace = true
