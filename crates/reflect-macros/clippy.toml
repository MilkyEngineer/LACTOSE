  { path = "f32::ln_1p", reason = "platform libm; use lactose_math" },
  { path = "f32::log", reason = "platform libm; use lactose_math" },
  { path = "f32::log2", reason = "platform libm; use lactose_math" },
  { path = "f32::log10", reason = "platform libm; use lactose_math" },
