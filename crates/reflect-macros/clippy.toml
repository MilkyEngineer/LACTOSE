# Determinism boundary lints, architecture section 8.2. Every crate in the [boundary] list of
# crate-tiers.toml carries an identical copy of this file; CI checks that they match.
# `lactose-math` is the one crate that may opt out of the float-method list, item by item.

disallowed-methods = [
  { path = "f32::min", reason = "nondeterministic on signed zero; use lactose_math" },
  { path = "f32::max", reason = "nondeterministic on signed zero; use lactose_math" },
  { path = "f32::clamp", reason = "use lactose_math compare-and-select clamp" },
  { path = "f32::powi", reason = "platform dependent; use lactose_math" },
  { path = "f32::total_cmp", reason = "observes NaN sign and payload" },
  { path = "f32::to_bits", reason = "observes NaN sign and payload; use lactose_math canonical bits" },
  { path = "f32::copysign", reason = "observes NaN sign" },
  { path = "f32::is_sign_negative", reason = "observes NaN sign" },
  { path = "f32::sin", reason = "platform libm; use lactose_math" },
  { path = "f32::cos", reason = "platform libm; use lactose_math" },
  { path = "f32::tan", reason = "platform libm; use lactose_math" },
  { path = "f32::asin", reason = "platform libm; use lactose_math" },
  { path = "f32::acos", reason = "platform libm; use lactose_math" },
  { path = "f32::atan", reason = "platform libm; use lactose_math" },
  { path = "f32::atan2", reason = "platform libm; use lactose_math" },
  { path = "f32::sin_cos", reason = "platform libm; use lactose_math" },
  { path = "f32::sinh", reason = "platform libm; use lactose_math" },
  { path = "f32::cosh", reason = "platform libm; use lactose_math" },
