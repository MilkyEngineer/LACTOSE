  { path = "f64::algebraic_mul", reason = "lets the optimiser reassociate and contract" },
  { path = "f64::algebraic_div", reason = "lets the optimiser reassociate and contract" },
  { path = "f64::algebraic_rem", reason = "lets the optimiser reassociate and contract" },
  { path = "f64::to_le_bytes", reason = "observes NaN sign and payload; use lactose_math canonical bits" },
