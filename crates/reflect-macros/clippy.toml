  { path = "f32::hypot", reason = "platform libm; use lactose_math" },
  { path = "f64::min", reason = "nondeterministic on signed zero; use lactose_math" },
  { path = "f64::max", reason = "nondeterministic on signed zero; use lactose_math" },
  { path = "f64::clamp", reason = "use lactose_math compare-and-select clamp" },
  { path = "f64::powi", reason = "platform dependent; use lactose_math" },
  { path = "f64::total_cmp", reason = "observes NaN sign and payload" },
  { path = "f64::to_bits", reason = "observes NaN sign and payload; use lactose_math canonical bits" },
  { path = "f64::copysign", reason = "observes NaN sign" },
  { path = "f64::is_sign_negative", reason = "observes NaN sign" },
  { path = "f64::sin", reason = "platform libm; use lactose_math" },
  { path = "f64::cos", reason = "platform libm; use lactose_math" },
  { path = "f64::tan", reason = "platform libm; use lactose_math" },
