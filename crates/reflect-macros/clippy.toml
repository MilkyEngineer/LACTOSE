  { path = "f64::sin_cos", reason = "platform libm; use lactose_math" },
  { path = "f64::sinh", reason = "platform libm; use lactose_math" },
  { path = "f64::cosh", reason = "platform libm; use lactose_math" },
  { path = "f64::tanh", reason = "platform libm; use lactose_math" },
  { path = "f64::exp", reason = "platform libm; use lactose_math" },
  { path = "f64::exp2", reason = "platform libm; use lactose_math" },
  { path = "f64::exp_m1", reason = "platform libm; use lactose_math" },
  { path = "f64::ln", reason = "platform libm; use lactose_math" },
  { path = "f64::ln_1p", reason = "platform libm; use lactose_math" },
  { path = "f64::log", reason = "platform libm; use lactose_math" },
  { path = "f64::log2", reason = "platform libm; use lactose_math" },
