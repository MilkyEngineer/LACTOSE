# The determinism boundary's bans on files, the process environment, subprocesses and the
# network (architecture section 8.2), for a crate outside [boundary] that [boundary_internal]
# `any` in crate-tiers.toml lets every boundary crate compile. `cargo xtask boundary` checks
# that these entries are exactly those of crates/core/clippy.toml, as written there. The
# float and executor bans of that file do not apply here. A test that reads a file or a
# variable lifts the lint with `#[expect]` on its one item.

