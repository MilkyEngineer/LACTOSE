[package]
name = "lactose-app-headless"
description = "The headless binary: the executor, the IO pool and one server world from the game's registrations, run for a bounded number of ticks at tick rate, its hash reported, optionally saved, shut down in order."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
# The assembly: the headless app, the policy and the registration the game hands over.
lactose-app.workspace = true
# The in-memory cooked content: one asset table pinned against a store that publishes all.
lactose-asset-api.workspace = true
# The in-memory cooked baseline.
lactose-bundle.workspace = true
lactose-core.workspace = true
# The game's system macro, its region and mode types.
lactose-ecs.workspace = true
# The game crate's `register_migrations` signature.
lactose-persist.workspace = true
# The game's component macro.
lactose-reflect.workspace = true
# The frame the game feeds and the registration types.
lactose-sim.workspace = true
# The subscriber that writes every event at `info` and above to stderr (architecture
# section 3, "traced from day one").
tracing-subscriber.workspace = true

[lints]
workspace = true
