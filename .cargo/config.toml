# Architecture section 8.2: every x86-64 build is pinned to the x86-64-v3 baseline so fused
# multiply-add is always available and no crate selects fused or unfused by target feature.
# Never set the RUSTFLAGS environment variable: it replaces these flags instead of adding to them.
# Cargo finds this file from the working directory, so always run cargo from inside the
# repository; `--manifest-path` from elsewhere drops the pin.
[target.'cfg(target_arch = "x86_64")']
rustflags = ["-C", "target-cpu=x86-64-v3"]
# Cargo does not pass `rustflags` to rustdoc, so doctests need the same pin stated again.
rustdocflags = ["-C", "target-cpu=x86-64-v3"]

# Architecture section 18: lld-link on Windows. `rust-lld` ships inside the toolchain's own
# sysroot, which rustc puts on the linker's search path, so no install step is needed; from the
# name rustc drives it as lld-link (`-flavor link`) and still hands it the MSVC library paths it
# finds itself. Only the linker is set here; the pin above stays the only rust flags.
# Section 18 asks for this in dev builds, but cargo has no per-profile linker: the key covers
# everything linked for this target, in every profile, build scripts, proc-macros and doctests
# included. That is wanted: the release golden vectors link as the debug tests do.
# x86_64-unknown-linux-gnu needs no entry: rustc links it with its bundled lld by default since
# 1.90. macOS keeps Apple's linker.
[target.x86_64-pc-windows-msvc]
linker = "rust-lld"

# `cargo xtask <check>` runs the CI driver in tools/xtask (tier check, boundary checks, feature
# trees, the SOUR mode runner). `cargo xtask help` lists the subcommands.
[alias]
xtask = "run --quiet --locked -p lactose-xtask --"
