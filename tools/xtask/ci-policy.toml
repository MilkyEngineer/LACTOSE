# Data for the checks in tools/xtask that is not a dependency rule. Which crate may depend on
# which, the boundary list and the boundary's dependency allowlists are all in
# crate-tiers.toml and nowhere else.

# Architecture section 21: the crates that may contain `unsafe`. Each carries SAFETY.md. Every
# other workspace crate carries `#![forbid(unsafe_code)]` at the top of every crate root:
# library, binaries, integration tests, benches, examples and the build script. `cargo xtask
# boundary` requires this list to equal the table of section 21, so the two change in the
# same commit.
[unsafe_crates]
crates = [
  "lactose-task", "lactose-ecs", "lactose-io", "lactose-rhi-vulkan", "lactose-rhi-metal",
  "lactose-rhi-dx12", "lactose-platform", "lactose-core", "lactose-cook",
]

# Crates outside [boundary] that still carry the boundary lint file, a byte-identical copy of
# crates/core/clippy.toml. The proc-macro crates do, because the code they write is compiled
# inside boundary crates and should be written under the same lints.
[lint_file_carriers]
crates = ["lactose-reflect-macros", "lactose-ecs-macros"]

# Architecture section 8.3: the shipped binaries, whose boundary feature trees must be
# identical to each other and to those of the [harness] packages. Every workspace package
# named `lactose-app-*` must be listed here.
[feature_roots]
packages = ["lactose-app-headless"]

# Architecture section 8.3: the packages whose tests run under SOUR, the determinism harness.
# Their feature trees are compared with dev-dependencies included, since a test build
# compiles them. Once `lactose-sim` exists this list may not be empty. `cargo xtask boundary`
# requires this list to be exactly the packages whose tests compile the harness protocol
# (tools/xtask/src/harness/protocol.rs).
#
# `tests` names every test that records hashes, as it records them. `cargo xtask sour run`
# fails if a recording test is missing from it, or if a listed test did not record: renamed,
# ignored, deleted or filtered out. A branch that adds, renames or removes a recording test
# edits this list in the same commit.
[harness]
packages = [
  "lactose-sim", "lactose-ecs", "lactose-physics-api", "lactose-input", "lactose-physics-rapier",
  "lactose-net-api", "lactose-predict", "lactose-net-host", "lactose-anim", "lactose-persist",
  "lactose-app",
]
tests = [
  "lactose_anim::sour::a_prediction_crowd_with_a_rollback",
  "lactose_anim::sour::a_server_crowd_with_ragdolls",
  "lactose_app::headless::a_recorded_headless_run",
  "lactose_app::spike::a_claim_in_contact_is_recorded",
  "lactose_app::spike::a_dynamic_capsule_is_recorded",
  "lactose_app::spike::a_kinematic_character_is_recorded",
  "lactose_app::spike::fifty_thrown_bodies_are_recorded",
  "lactose_input::sour::the_prediction_program_with_a_rollback",
  "lactose_input::sour::the_server_program",
  "lactose_net_api::sour::a_scene_replicated_to_a_client",
  "lactose_net_host::sour::a_replication_and_its_wire_values",
  "lactose_persist::physics::reload_at_12",
  "lactose_persist::reload::in_place_at_60",
  "lactose_persist::reload::left_player_at_160",
  "lactose_persist::reload::two_frames_at_60",
  "lactose_persist::reload::unload_and_reload",
  "lactose_physics_api::sour::a_prediction_scene_with_a_rollback",
  "lactose_physics_api::sour::a_server_scene",
  "lactose_physics_rapier::sour::a_limited_hinge_driven_against_its_limits",
  "lactose_physics_rapier::sour::a_prediction_scene_with_a_rollback",
  "lactose_physics_rapier::sour::a_server_scene",
  "lactose_physics_rapier::sour::the_conformance_run",
  "lactose_predict::sour::a_prediction_scene_with_corrections_and_substitutions",
  "lactose_sim::cost::scene",
  "lactose_sim::sour::anchored_world",
]

# Architecture section 20: the packages the nightly Miri job runs as several entries of its
# matrix (.github/workflows/nightly.yml), for the time limit. `cargo xtask boundary` requires
# the entries that name such a package to run, together, its library, each of its
# integration test targets and its doc tests exactly once, so that a new test target cannot
# drop out of Miri unseen.
[miri_split]
packages = ["lactose-ecs"]
