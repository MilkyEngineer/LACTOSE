# Architecture section 20: the packages the nightly Miri job runs as several entries of its
# matrix (.github/workflows/nightly.yml), for the time limit. `cargo xtask boundary` requires
# the entries that name such a package to run, together, each test of its library, of each of
# its integration test targets and of its doc tests exactly once, so that a new test cannot
# drop out of Miri unseen: one entry runs a target whole, or two divide it, one naming
# libtest filters after `--` and the other skipping each of them with `--skip`. A filter of
# any entry is `<module>::`, where the root of a test target the entry selects declares the
# module and no `cfg` naming `miri` compiles it out. It reports an empty list, and a package
# that two or more entries name by target or filter that the list leaves out.
[miri_split]
packages = ["lactose-ecs"]

# D150: a package with more than one integration test file builds them as one test binary,
# the target `integration`, whose root `tests/integration.rs` declares every other file of
# `tests/` as a module named after the file (`autotests = false` in the manifest), or under a
# name for what it holds, with `#[path]`, where the file's name is a codename (CLAUDE.md,
# Names). `separate` lists, as `package::target`, the test targets that must stay binaries of
# their own, each under its reason: the tests of one binary share a process under `cargo test`
# and `cargo miri test`. `cargo xtask boundary` reports a package with more than one test
# target outside this list, an entry that names no test target, a file of `tests/` that cargo
# would make a target (`*.rs`, `*/main.rs`) and no target compiles, and a module of a test
# target whose name holds a codename.
[test_targets]
separate = [
  # A binary has one `#[global_allocator]`. Each of these installs its own to count
  # allocations, which in the package's one binary would count every other test too (and
  # `lactose-asset`'s two could not share it).
  "lactose-asset::drop",
  "lactose-asset::index",
  "lactose-ecs::alloc",
  "lactose-input::lookup",
  "lactose-io::requests",
  "lactose-net-host::interpolation_alloc",
  "lactose-persist::container",
  "lactose-physics-rapier::memory",
  # Tests of one binary share a process under `cargo test` and `cargo miri test`, and each
  # of these installs the process's one tracing subscriber and reads back what it saw.
  "lactose-app::proof",
  "lactose-asset::failures",
  "lactose-asset::locking",
  "lactose-asset::mounts",
  "lactose-asset::pack",
  "lactose-asset::reads",
  "lactose-asset::spans",
  "lactose-ecs::channel_skip",
  "lactose-ecs::ownership",
  "lactose-ecs::units",
  "lactose-io::spans",
  "lactose-predict::logs",
  "lactose-task::spans",
  # Each measures what is one per process: its CPU time, and whether rayon's global pool
  # was started, which another test of the binary would add to or start.
  "lactose-physics-rapier::global_pool",
  "lactose-task::idle_cpu",
  # `cargo xtask sour self-test` builds this target alone, in a target directory of its own.
  "lactose-xtask::harness_stand_in",
  # It asserts when a slot's lock is let go, and a process that another test of one binary
  # spawns holds a copy of the lock until its exec.
  "lactose-xtask::heavy",
]

# Milestone 2 plan, decision 5.15: each check job of .github/workflows/ci.yml builds, lints and
# tests one of these groups on each platform, so that no one job builds every package's tests.
# The job reads its packages from `cargo xtask group <name>`, so this table is the only list.
# `cargo xtask boundary` reports a workspace package in no group or in two, an entry that
# names no package and an empty group. The two names are fixed in tools/xtask/src/policy.rs,
# and `cargo xtask boundary` holds the workflow's check job to them: its matrix names each group
# in this order, and its steps hand each group its packages with no condition. A third group is
# a finding until the workflow runs a job for it.
#
# `physics` is lactose-physics-api and every package whose normal dependencies reach it,
# directly or through another package, so that one group alone compiles the vendored
# rapier3d-f64 and the packages built on the physics interface; `base` is every other package.
# A new package goes into the group that rule names. The rule balances the two builds (the
# workflow's header gives the figures); a package that would unbalance them is moved here with
# its reason.
[check_groups]
base = [
  "lactose-core", "lactose-math", "lactose-task", "lactose-reflect", "lactose-reflect-macros",
  "lactose-ecs-macros", "lactose-ecs", "lactose-bundle", "lactose-asset-api", "lactose-io",
  "lactose-asset", "lactose-input", "lactose-input-host", "lactose-sim", "lactose-net-api",
  "lactose-net-host", "lactose-persist", "lactose-xtask", "game-sim", "lactose-rhi-api",
  "lactose-platform",
]
physics = [
  "lactose-physics-api", "lactose-physics-rapier", "lactose-anim", "lactose-predict",
  "lactose-app", "lactose-app-headless", "lactose-cook", "lactose-present-api",
]
