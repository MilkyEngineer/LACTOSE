[package]
name = "lactose-xtask"
description = "CI driver: tier check, boundary checks, feature-tree comparison, the check of patched vendored crates, the SOUR mode runner and the machine-wide slot for heavy commands."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
autotests = false

[dependencies]
serde.workspace = true
serde_json = { workspace = true, features = ["float_roundtrip"] }
sha2.workspace = true
toml.workspace = true

# The integration tests as one test binary, whose root declares the files of tests/ as
# modules (D125).
[[test]]
name = "integration"
path = "tests/integration.rs"

# A binary of its own ([test_targets] in tools/xtask/ci-policy.toml): `cargo xtask sour
# self-test` builds it alone, in a target directory of its own.
[[test]]
name = "harness_stand_in"
path = "tests/harness_stand_in.rs"

[lints]
workspace = true
