# The single statement of which crate may depend on which. CI enforces it (`cargo xtask tiers`
# and `cargo xtask boundary`).
#
# Every crate is in exactly one of [foundation], [backend], [assembly], [leaf] and [game]; a
# crate missing from all of them fails the tier check. Dev-dependencies obey the same rules as
# normal and build dependencies, with the two concessions named below.
#
# Foundation crates may be depended on by any crate, and depend on foundation crates only.
# Backend crates may be named only by assembly crates, by leaf crates and by [exceptions].
#   They may not depend on game, assembly or leaf crates.
# Assembly crates put a runtime together: they may depend on foundation, backend and game
#   crates. Only leaf crates may depend on an assembly crate.
# Leaf crates (binaries and tools) may depend on anything, subject to [server_denylist]. Only
#   leaf crates may depend on a leaf crate.
# Game crates may depend on foundation crates and on other game crates.
# Dev-dependency concessions: a crate may dev-depend on itself, and any crate may dev-depend
#   on a [test_support] crate.
# Build scripts and proc macros may not depend on boundary crates (they compile for the host
# without the pinned target features).
# Every dependency that is a path dependency must be a workspace member, and a dependency
# whose name appears in this file is held to these rules wherever it comes from.
# A crate built from a patched copy under vendor/ (architecture section 8.2, D123) is not a
# path dependency: it is named by its crates.io name, replaced through [patch.crates-io] in
# the root Cargo.toml, and held to the lists below under that name; `cargo xtask vendor`
# proves the copy is the published archive plus its patch. Patching a crate on these lists
# is a determinism review, as adding one is.

[foundation]
crates = [
  "lactose-core", "lactose-math", "lactose-task", "lactose-ecs", "lactose-reflect",
  "lactose-sim", "lactose-anim", "lactose-predict", "lactose-nav-query",
  "lactose-physics-api", "lactose-asset-api", "lactose-bundle", "lactose-present-api",
  "lactose-net-api", "lactose-net-host", "lactose-rhi-api", "lactose-input",
  "lactose-input-host", "lactose-io",
  # Proc-macro crates. They compile for the host, so they are outside the boundary and may
  # not depend on a boundary crate; the code they emit lands in the crate that invokes them.
  "lactose-reflect-macros", "lactose-ecs-macros",
]

[backend]
crates = [
  "lactose-asset", "lactose-physics-rapier", "lactose-net", "lactose-persist",
  "lactose-rhi-vulkan", "lactose-rhi-metal", "lactose-rhi-null", "lactose-rhi-dx12",
  "lactose-render-graph", "lactose-renderer", "lactose-presentation", "lactose-terrain",
  "lactose-audio", "lactose-ui", "lactose-nav", "lactose-platform", "lactose-debug-ui",
]

[assembly]
crates = ["lactose-app"]

[leaf]
crates = [
  "lactose-app-client", "lactose-app-server", "lactose-app-headless", "lactose-cook",
  "lactose-xtask",
]

[game]
crates = ["game-sim", "game-present", "game-ai", "game-content"]

[test_support]
# Crates any crate may name as a dev-dependency, whatever its tier. Each is also in a tier
# section, whose rules govern its normal and build edges.
crates = ["lactose-rhi-null"]

[boundary]
# Crates inside the determinism boundary. clippy.toml and the allowlists below apply here.
crates = [
  "lactose-core", "lactose-math", "lactose-ecs", "lactose-sim", "lactose-anim",
  "lactose-predict", "lactose-nav-query", "lactose-physics-api", "lactose-physics-rapier",
  "lactose-bundle", "lactose-input", "lactose-net-api", "game-sim", "game-ai", "game-content",
]

[server_denylist]
# lactose-app-server may not depend on these, directly or transitively.
crates = [
  "lactose-render-graph", "lactose-renderer", "lactose-presentation", "lactose-platform",
  "lactose-audio", "lactose-ui", "lactose-debug-ui", "lactose-rhi-vulkan", "lactose-rhi-metal",
  "lactose-rhi-dx12", "lactose-rhi-null",
]

# Edges that need no exception because the target is foundation: net -> predict,
# presentation -> net-api (interpolation buffer), audio -> present-api (listener requests),
# persist -> bundle, asset -> bundle, cook -> bundle.

# Backend-to-backend edges only: both the crate named and the crates it may depend on are
# backend crates.
[exceptions]
"lactose-renderer"     = { may_depend_on = ["lactose-render-graph"], reason = "passes are the renderer's output" }
"lactose-presentation" = { may_depend_on = ["lactose-renderer"], reason = "pose evaluation and remote transform upload feed the renderer" }
"lactose-debug-ui"     = { may_depend_on = ["lactose-renderer", "lactose-platform"], reason = "overlay draws through the renderer and reads window events" }
"lactose-terrain"      = { may_depend_on = ["lactose-renderer"], reason = "clipmap passes through RenderFeature" }
"lactose-ui"           = { may_depend_on = ["lactose-renderer", "lactose-render-graph"], reason = "UI pass through RenderFeature" }
"lactose-persist"      = { may_depend_on = ["lactose-asset"], reason = "overlay diffing needs the loaded cooked baseline" }

# The dependency allowlist of the determinism boundary (architecture section 8.2), enforced by
# `cargo xtask boundary`. A boundary crate may always depend on another boundary crate, subject
# to the tier rules above. Its normal and build dependencies on anything else must be named
# here. Dev-dependencies on workspace crates are left to the tier rules.

# Non-boundary foundation crates a boundary crate may depend on. Section 8.2 names the first
# three for any boundary crate ("only for types and for operations that are deterministic by
# construction") and `task` for `ecs` alone ("for execution only"). The two proc-macro crates
# run on the host at compile time and the code they emit lands in the invoking crate.
# `lactose-input-host` (raw samples, the quantiser, device sources) is deliberately absent:
# the host side of input is floats and devices, and `lactose-input`, the sample and its
# applier, is in [boundary] itself.
# `lactose-net-host` (quantisation, the handshake, the transport, packets, interest, the
# interpolation buffer, clock sync) is deliberately absent: the host side of networking is
# floats, clocks and sockets, and `lactose-net-api`, the staged frame and the gather, is in
# [boundary] itself.
[boundary_internal]
any = [
  "lactose-reflect", "lactose-asset-api", "lactose-present-api",
  "lactose-reflect-macros",
]

[boundary_internal.only]
"lactose-ecs" = ["lactose-task", "lactose-ecs-macros"]

# Third-party crates. `direct` says which of them each boundary crate may name: `normal` as a
# normal, build or dev dependency, `dev` as a dev-dependency only. Every third-party crate that
# a boundary crate ends up compiling through normal and build edges, at any depth and through
# any workspace crate, must be on some crate's `normal` list or on `transitive`.
#
# Adding a name is a determinism review: the crate must do no floating-point work of its own
# and select no code path by CPU feature (`libm` is the one exception section 8.2 names).
[boundary_third_party]
transitive = [
  # bytemuck's derive macros and what they are built from; host code.
  "bytemuck_derive", "proc-macro2", "quote", "syn", "unicode-ident",
  # windows-sys's link shim.
  "windows-link",
  # Architecture section 3: traced from day one. `tracing` reaches boundary crates through
  # `lactose-reflect` and `lactose-task`; it emits spans and events and computes nothing a
  # simulation result can observe.
  "tracing", "tracing-core", "once_cell", "pin-project-lite",
  # The executor's deques, reached by `lactose-ecs` through `lactose-task` (architecture
  # section 8.2: execution only). Lock-free queues and epoch reclamation: no floating-point
  # work and no numeric path selected by CPU feature; what they decide is which worker runs
  # a job, which the ECS makes order-independent by construction.
  "crossbeam-deque", "crossbeam-epoch", "crossbeam-utils",
]

[boundary_third_party.direct]
"lactose-core" = { normal = ["bytemuck", "libc", "windows-sys"], dev = ["xxhash-rust"] }
"lactose-math" = { normal = ["bytemuck", "libm"] }
"lactose-ecs" = { normal = ["bytemuck", "tracing"] }
"lactose-sim" = { normal = ["tracing"], dev = ["xxhash-rust"] }
"lactose-physics-api" = { normal = ["tracing"] }
